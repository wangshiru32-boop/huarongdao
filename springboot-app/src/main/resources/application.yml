server:
  port: 8080
  servlet:
    context-path: /huarongdao
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

spring:
  datasource:
    url: jdbc:h2:file:./data/huarongdao;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
  web:
    resources:
      cache:
        period: 0

logging:
  level:
    com.example.huarongdao: INFO
